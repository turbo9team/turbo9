name: RTL validation

on:
  pull_request:
  push:
    branches: [work, main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install simulation and synthesis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          iverilog -V
          yosys -V
      - name: Check generated microcode
        run: bash sim/generate_microcode.sh --check
      - name: Run directed interrupt matrix
        run: |
          set -o pipefail
          bash sim/run_interrupts.sh 2>&1 | tee interrupts.log
      - name: Synthesize all six pipelines
        run: |
          set -o pipefail
          bash sim/run_synthesis.sh 2>&1 | tee synthesis.log
      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-validation
          path: |
            interrupts.log
            synthesis.log
          if-no-files-found: ignore
