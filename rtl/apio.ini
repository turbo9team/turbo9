# Run from the repository root with: apio build -p rtl
# https://fpgawars.github.io/apio/docs/project-file/
[env:default]
board = arty-a7-35t
top-module = fpga_top
constraint-file = fpga_top.xdc
# nextpnr does not apply the divider's Vivado generated-clock constraint.
# Set its default timing target to the actual 50 MHz CPU/memory clock.
nextpnr-extra-options =
    --freq 50

[env:basys3]
board = basys3
top-module = fpga_top
constraint-file = fpga_top_basys3.xdc
nextpnr-extra-options =
    --freq 50
